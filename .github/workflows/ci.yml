name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run lint
      - run: npm test
        env:
          # Service-manager round-trips register a real user service on the runner. Opt in.
          PI_DAEMON_SERVICE_TESTS: "1"
