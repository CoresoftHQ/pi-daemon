name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A leaked runner process would otherwise hold `node --test` open until GitHub's 6-hour cap.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run lint
      - run: npm run build
      - run: node packages/daemon/dist/cli/main.js --version
      - run: npm test
        env:
          # Service-manager round-trips register a real user service on the runner. Opt in.
          PI_DAEMON_SERVICE_TESTS: "1"

  # The self-contained tarball the one-line installs consume: build it and install it into a
  # fresh prefix, which is what catches an undeclared dependency the monorepo would hide.
  package:
    name: package (tarball smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/release/build.mjs tgz
      - run: |
          npm i -g --prefix ./smoke ./release/pi-daemon-*.tgz --no-audit --no-fund
          ./smoke/bin/pi-daemon --version
          ./smoke/bin/pi-daemon doctor --json | head -c 400; echo
      - run: sh -n install.sh

  # The supported pi range (capabilities.pi.supported) is a promise: test both ends with the
  # real pi, no provider needed (RPC mode answers get_state and lists models without one).
  pi-compat:
    name: pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.84.0", "0.85.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i -g @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: pi --version
      - run: node --conditions=development --test --test-force-exit "packages/daemon/src/runners/pi-compat.test.ts" "packages/daemon/src/runners/runner.test.ts"
        env:
          PI_DAEMON_REAL_PI: "1"
